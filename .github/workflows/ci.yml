# ============================================================================
# coro — 企业级 CI 流水线
# ============================================================================
#
#  全部并行:
#    - lint: 只读格式检查
#    - Linux: GCC 13 + Clang 18 × {Debug, Release}
#    - macOS: (暂时禁用, 待 kqueue 事件源实现)
#    - Windows: MSVC × {Debug, Release}
#    - Sanitizer: ASan+UBSan (GCC), TSan (Clang)
#    - 静态分析: cppcheck
#    - 代码覆盖率: gcov + lcov
# ============================================================================

name: CI

# 控制编译和测试并行度；显式 Bash 保证管道中的失败不会被 tee 掩盖。
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "1"
defaults:
  run:
    shell: bash
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 的新 push 自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 代码格式检查（只读门禁）
  # ============================================================
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find include router examples tests Web/src Web/main.cpp main.cpp \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 | \
          xargs -0 -r clang-format-18 --dry-run --Werror

  # ============================================================
  # Linux — GCC 13 + Clang 18, Debug + Release
  # ============================================================
  build-linux:
    name: Linux (${{ matrix.label }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "GCC 13"
            compiler: g++-13
            cc: gcc-13
            install: g++-13
            build_type: Debug
          - label: "GCC 13"
            compiler: g++-13
            cc: gcc-13
            install: g++-13
            build_type: Release
          - label: "Clang 18"
            compiler: clang++-18
            cc: clang-18
            install: clang-18
            build_type: Debug
          - label: "Clang 18"
            compiler: clang++-18
            cc: clang-18
            install: clang-18
            build_type: Release
    env:
      CXX: ${{ matrix.compiler }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }} liburing-dev pkg-config
          "$CXX" --version
          pkg-config --modversion liburing
          uname -sr

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCORO_REQUIRE_URING=ON \
            -DCORO_ENABLE_WEB=ON \
            -DCORO_BUILD_TESTS=ON \
            -DCORO_BUILD_EXAMPLES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all targets
        run: |
          cmake --build build 2>&1 | tee build.log

      - name: Run unit tests
        timeout-minutes: 5
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Verify installed package
        run: |
          cmake --install build --prefix "$PWD/build/install-root"
          cmake -S tests/package_smoke -B build/package-smoke \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$PWD/build/install-root"
          cmake --build build/package-smoke
          ./build/package-smoke/coro_package_smoke

      - name: Verify standalone Web build
        timeout-minutes: 5
        run: |
          cmake -S Web -B build-web \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCORO_REQUIRE_URING=ON
          cmake --build build-web --target web_server
          ./build-web/web_server --selftest 18083
          ./build-web/web_server --stress 2 3

      - name: Verify portable core without io_uring
        if: matrix.label == 'GCC 13' && matrix.build_type == 'Debug'
        run: |
          cmake -B build-core \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORO_ENABLE_URING=OFF \
            -DCORO_BUILD_TESTS=ON \
            -DCORO_BUILD_EXAMPLES=OFF
          cmake --build build-core --target coro_tests
          ctest --test-dir build-core --output-on-failure --timeout 120

      - name: Run stress test (Release only)
        if: matrix.build_type == 'Release'
        timeout-minutes: 5
        run: ./build/coro_stress

      - name: Upload build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}-logs
          path: |
            build.log
            build/Testing/Temporary/
            build-core/Testing/Temporary/

  # ============================================================
  # macOS — Apple Clang, Debug + Release
  # (暂时禁用: macOS 缺少 IOCP/io_uring, 待 kqueue 事件源实现后启用)
  # ============================================================
  # build-macos:
  #   name: macOS (${{ matrix.build_type }})
  #   runs-on: macos-14
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       build_type: [Debug, Release]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: ccache
  #       uses: hendrikmuhs/ccache-action@v1.2
  #       with:
  #         key: macos-${{ matrix.build_type }}
  #     - name: Configure CMake
  #       run: |
  #         cmake -B build \
  #           -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
  #           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
  #           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  #     - name: Build all targets
  #       run: cmake --build build -j$(sysctl -n hw.ncpu)
  #     - name: Run unit tests
  #       run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120
  #     - name: Run stress test (Release only)
  #       if: matrix.build_type == 'Release'
  #       timeout-minutes: 5
  #       run: ./build/coro_stress

  # ============================================================
  # Windows — MSVC, Debug + Release
  # ============================================================
  build-windows:
    name: Windows (${{ matrix.build_type }})
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCORO_ENABLE_WEB=ON -DCORO_BUILD_TESTS=ON -DCORO_BUILD_EXAMPLES=ON

      - name: Build all targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run unit tests
        timeout-minutes: 5
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Verify installed package
        run: |
          cmake --install build --config ${{ matrix.build_type }} --prefix "$env:GITHUB_WORKSPACE\build\install-root"
          cmake -S tests/package_smoke -B build/package-smoke -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\build\install-root"
          cmake --build build/package-smoke --config ${{ matrix.build_type }}
          & "build\package-smoke\${{ matrix.build_type }}\coro_package_smoke.exe"

      - name: Verify standalone Web build
        timeout-minutes: 5
        run: |
          cmake -S Web -B build-web
          cmake --build build-web --config ${{ matrix.build_type }} --target web_server
          & "build-web\${{ matrix.build_type }}\web_server.exe" --selftest 18083
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build-web\${{ matrix.build_type }}\web_server.exe" --stress 2 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run stress test (Release only)
        if: matrix.build_type == 'Release'
        timeout-minutes: 5
        run: build\Release\coro_stress.exe

  # ============================================================
  # Sanitizer 构建 (Linux)
  # ============================================================
  sanitizer:
    name: Sanitizer (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ASan+UBSan (GCC)"
            cxx: g++-13
            cc: gcc-13
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            install: g++-13
          - name: "TSan (Clang)"
            cxx: clang++-18
            cc: clang-18
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
            install: clang-18
    env:
      CXX: ${{ matrix.cxx }}
      CC: ${{ matrix.cc }}
      CXXFLAGS: ${{ matrix.flags }}
      CFLAGS: ${{ matrix.flags }}
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
      TSAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:abort_on_error=1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }} liburing-dev pkg-config
          "$CXX" --version
          pkg-config --modversion liburing
          uname -sr

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCORO_REQUIRE_URING=ON -DCORO_ENABLE_WEB=ON -DCORO_BUILD_TESTS=ON -DCORO_BUILD_EXAMPLES=OFF

      - name: Build (tests only)
        run: cmake --build build --target coro_tests

      - name: Run tests with sanitizer
        timeout-minutes: 10
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ============================================================
  # 静态分析 (cppcheck)
  # ============================================================
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck (core library)
        run: |
          # header-only 库必须显式传入头文件；目录扫描会跳过 .hpp。
          headers=(include/coro/*.hpp)
          test -f "${headers[0]}"
          cppcheck --version
          # 隐藏逐文件进度，保留诊断；局部抑制仅用于已说明原因的代码位置。
          cppcheck --quiet --enable=warning,performance,portability \
            --language=c++ --std=c++20 --inline-suppr --suppress=missingIncludeSystem \
            -I include \
            --error-exitcode=1 \
            "${headers[@]}" 2>&1 | tee cppcheck.log

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.log

  # ============================================================
  # 代码覆盖率 (GCC + gcov + lcov)
  # ============================================================
  coverage:
    name: Coverage (GCC + gcov)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 liburing-dev pkg-config lcov
          "$CXX" --version
          pkg-config --modversion liburing
          uname -sr

      - name: Configure CMake (coverage flags)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORO_REQUIRE_URING=ON \
            -DCORO_ENABLE_WEB=ON \
            -DCORO_BUILD_TESTS=ON \
            -DCORO_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"

      - name: Build tests
        run: cmake --build build --target coro_tests

      - name: Run tests
        timeout-minutes: 5
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --gcov-tool gcov-13 \
            --ignore-errors mismatch,gcov,negative
          lcov --remove coverage.info \
            '/usr/*' '*/thirdparty/*' '*/tests/*' '*/examples/*' \
            --output-file coverage_filtered.info \
            --ignore-errors mismatch,unused
          genhtml coverage_filtered.info --output-directory coverage_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 30

      - name: Coverage summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lcov --list coverage_filtered.info | tail -1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
