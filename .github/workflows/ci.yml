# ============================================================================
# coro — 企业级 CI 流水线
# ============================================================================
#
#  全部并行:
#    - lint: 格式检查 → 失败时自动格式化并回推
#    - Linux: GCC 13 + Clang 18 × {Debug, Release}
#    - macOS: (暂时禁用, 待 kqueue 事件源实现)
#    - Windows: MSVC × {Debug, Release}
#    - Sanitizer: ASan+UBSan (GCC), TSan (Clang)
#    - 静态分析: cppcheck
#    - 代码覆盖率: gcov + lcov
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 的新 push 自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 代码格式检查 + 自动修复回推
  # ============================================================
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        id: check
        run: |
          find coro/include router examples tests Web/src main.cpp \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) | \
          xargs clang-format --dry-run --Werror 2>format_errors.txt || true
          if [ -s format_errors.txt ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
            cat format_errors.txt
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-fix formatting and push
        if: steps.check.outputs.has_errors == 'true' && github.event_name == 'push'
        run: |
          find coro/include router examples tests Web/src main.cpp \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) | \
          xargs clang-format -i
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-format code [skip ci]" || true
          git push

  # ============================================================
  # Linux — GCC 13 + Clang 18, Debug + Release
  # ============================================================
  build-linux:
    name: Linux (${{ matrix.label }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "GCC 13"
            compiler: g++-13
            cc: gcc-13
            install: g++-13
            build_type: Debug
          - label: "GCC 13"
            compiler: g++-13
            cc: gcc-13
            install: g++-13
            build_type: Release
          - label: "Clang 18"
            compiler: clang++-18
            cc: clang-18
            install: clang-18
            build_type: Debug
          - label: "Clang 18"
            compiler: clang++-18
            cc: clang-18
            install: clang-18
            build_type: Release
    env:
      CXX: ${{ matrix.compiler }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }} liburing-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all targets
        run: |
          cmake --build build -j$(nproc) 2>&1 | tee build.log || {
            echo "=== BUILD FAILED ==="
            grep -E "error:|fatal error:" build.log | head -20
            exit 1
          }

      - name: Run unit tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Run stress test (Release only)
        if: matrix.build_type == 'Release'
        timeout-minutes: 5
        run: ./build/coro_stress

  # ============================================================
  # macOS — Apple Clang, Debug + Release
  # (暂时禁用: macOS 缺少 IOCP/io_uring, 待 kqueue 事件源实现后启用)
  # ============================================================
  # build-macos:
  #   name: macOS (${{ matrix.build_type }})
  #   runs-on: macos-14
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       build_type: [Debug, Release]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: ccache
  #       uses: hendrikmuhs/ccache-action@v1.2
  #       with:
  #         key: macos-${{ matrix.build_type }}
  #     - name: Configure CMake
  #       run: |
  #         cmake -B build \
  #           -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
  #           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
  #           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  #     - name: Build all targets
  #       run: cmake --build build -j$(sysctl -n hw.ncpu)
  #     - name: Run unit tests
  #       run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120
  #     - name: Run stress test (Release only)
  #       if: matrix.build_type == 'Release'
  #       timeout-minutes: 5
  #       run: ./build/coro_stress

  # ============================================================
  # Windows — MSVC, Debug + Release
  # ============================================================
  build-windows:
    name: Windows (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build all targets
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run unit tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Run stress test (Release only)
        if: matrix.build_type == 'Release'
        timeout-minutes: 5
        run: build\Release\coro_stress.exe

  # ============================================================
  # Sanitizer 构建 (Linux)
  # ============================================================
  sanitizer:
    name: Sanitizer (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ASan+UBSan (GCC)"
            cxx: g++-13
            cc: gcc-13
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            install: g++-13
          - name: "TSan (Clang)"
            cxx: clang++-18
            cc: clang-18
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
            install: clang-18
    env:
      CXX: ${{ matrix.cxx }}
      CC: ${{ matrix.cc }}
      CXXFLAGS: ${{ matrix.flags }}
      CFLAGS: ${{ matrix.flags }}
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
      TSAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "print_stacktrace=1:abort_on_error=1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }} liburing-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build (tests only)
        run: cmake --build build --target coro_tests -j$(nproc)

      - name: Run tests with sanitizer
        timeout-minutes: 10
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

  # ============================================================
  # 静态分析 (cppcheck)
  # ============================================================
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck (core library)
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c++20 --suppress=missingIncludeSystem \
            -I coro/include \
            --error-exitcode=1 \
            coro/include/ 2>&1 | tee cppcheck.log

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.log

  # ============================================================
  # 代码覆盖率 (GCC + gcov + lcov)
  # ============================================================
  coverage:
    name: Coverage (GCC + gcov)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 liburing-dev lcov

      - name: Configure CMake (coverage flags)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"

      - name: Build tests
        run: cmake --build build --target coro_tests -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --gcov-tool gcov-13
          lcov --remove coverage.info \
            '/usr/*' '*/thirdparty/*' '*/tests/*' '*/examples/*' \
            --output-file coverage_filtered.info
          genhtml coverage_filtered.info --output-directory coverage_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 30

      - name: Coverage summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lcov --list coverage_filtered.info | tail -1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
