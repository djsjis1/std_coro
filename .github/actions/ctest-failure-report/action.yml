name: 'Report ctest failures'
description: '把失败的 ctest 用例以 annotation 形式报出，避免只能登录 Actions 才能看到失败详情'

inputs:
  build-dir:
    description: 'ctest 构建目录'
    required: false
    default: 'build'
  label:
    description: 'annotation 前缀，用于区分同一 run 中的不同 job'
    required: false
    default: 'ctest'

runs:
  using: 'composite'
  steps:
    - name: Collect failing tests
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        LABEL: ${{ inputs.label }}
      run: |
        # 诊断步骤本身不应改变 job 结论: 采集过程中的空匹配不算错误
        set +eo pipefail
        # 主 log 固定位于 Testing/Temporary/LastTest.log; 注意不能直接 find -name
        # LastTest.log: 每个测试子目录 Testing/<name>/ 下也有一份该测试单独运行的
        # log, find 命中的第一个很可能不是主 log, 会永远看不到用例结果行。
        log="$BUILD_DIR/Testing/Temporary/LastTest.log"
        [ -f "$log" ] || log=$(find "$BUILD_DIR" -path '*/Temporary/LastTest.log' -print -quit 2>/dev/null)
        if [ -z "$log" ]; then
          echo "::warning::$LABEL: LastTest.log not found, nothing to report"
          exit 0
        fi
        # 每测试节尾的结果行是 "Test Passed." / "Test Failed." (3.26 起即如此),
        # 个别版本还用 "***Failed <reason>" 行; 两种都认。
        failing=$(grep -nE 'Test Failed\.|^\*\*\*(Failed|Timeout|Not Run|SIGSEGV|SIGABRT|Exception)' "$log" | head -n 10)
        if [ -z "$failing" ]; then
          # 常见于"有测试失败但结果行格式未被上文模式覆盖", 把测试行与结果统计带出;
          # 同时兼容 CTest 3.26 ("N/M Test: name") 与 3.28 ("N/M Test  #N: name")。
          lines=$(grep -E '^[0-9]+/[0-9]+ Test' "$log" | sed 's/^[[:space:]]*//' | tr '\n' '|' | cut -c1-900)
          pass=$(grep -c 'Test Passed\.' "$log")
          extra=$(grep -vE '^[0-9]+/[0-9]+ Test|^[[:space:]]*$|-----' "$log" | tail -n 4 | tr '\n' '|' | cut -c1-300)
          echo "::error::$LABEL: no matched case; pass=$pass; results: $lines"
          echo "::error::$LABEL: log extras: $extra"
          exit 0
        fi
        while IFS= read -r line; do
          # 带出该结果行前 30 行的 gtest 失败输出 (含 [  FAILED  ] 用例名与 expected/actual)
          lineno=${line%%:*}
          echo "::error::$LABEL failing case: $(sed -n "$((lineno-30)),$((lineno+4))p" "$log" | grep -vE '^[[:space:]]*$' | tr '\n' '|' | cut -c1-1500)"
          # gtest 崩溃/abort 时可能毫无失败输出: 取第一个测试节的尾部 1500 字符,
          # 崩溃消息 (assert stderr/信号说明) 位于节尾且无缓冲, 一定在这里。
          echo "::error::$LABEL section tail: $(awk 'NR==1,/2\/[0-9]+ Test/' "$log" | tail -c 1500 | tr '\n' '|')"
          # 直接单跑失败用例拿真实退出码 (非 sanitizer 环境): brief 模式只打失败行
          if [ -z "$ASAN_OPTIONS$TSAN_OPTIONS" ] && [ -x "$BUILD_DIR/coro_tests" ]; then
            timeout 60 "$BUILD_DIR/coro_tests" --gtest_filter='UringFailureTest.*' --gtest_brief=1 > /tmp/direct_run.log 2>&1
            rc=$?
            echo "::error::$LABEL direct run exit=$rc: $(tail -n 40 /tmp/direct_run.log | tr '\n' '|' | cut -c1-1300)"
          fi
        done <<< "$failing"
        # 失败用例自身的输出片段最能说明原因, 一并留到摘要
        {
          echo "### $LABEL failing cases"
          echo '```'
          grep -A 15 '\*\*\*Failed\|\*\*\*Timeout\|\*\*\*SIGSEGV\|\*\*\*SIGABRT' "$log" | tail -n 120
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0
