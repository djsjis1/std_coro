name: 'Report ctest failures'
description: '把失败的 ctest 用例名以 annotation 报出，定位问题不必登录 Actions 看日志'

inputs:
  build-dir:
    description: 'ctest 构建目录'
    required: false
    default: 'build'
  label:
    description: 'annotation 前缀，用于区分同一 run 中的不同 job'
    required: false
    default: 'ctest'

runs:
  using: 'composite'
  steps:
    - name: Collect failing tests
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        LABEL: ${{ inputs.label }}
      run: |
        # 诊断步骤本身不应改变 job 结论: 采集过程中的空匹配不算错误
        set +eo pipefail
        # 主 log 固定位于 Testing/Temporary/LastTest.log; 注意不能直接 find -name
        # LastTest.log: 每个测试子目录 Testing/<name>/ 下也有一份该测试单独运行的
        # log, find 命中的第一个很可能不是主 log, 会永远看不到用例结果行。
        # 主 log 固定在 Testing/Temporary/LastTest.log; 注意不能直接 find -name
        # LastTest.log: 每个测试子目录 Testing/<name>/ 下也有一份该测试单独运行的
        # log, 命中的第一个很可能不是主 log, 会永远看不到用例结果行。
        # 也不用外部 find: Windows runner 的 bash 里 `find` 可能被解析成
        # System32\find.exe (不是 GNU find), 命令失败会让兜底形同不存在 —— CI 上
        # Windows 两个作业就因此只留下"LastTest.log not found", 报不出用例名。
        # 改用 shell glob, 同时覆盖 VS 多配置的 Testing/<Config>/Temporary/ 布局。
        log=""
        for c in \
            "$BUILD_DIR/Testing/Temporary/LastTest.log" \
            "$BUILD_DIR"/Testing/*/Temporary/LastTest.log \
            "$BUILD_DIR"/*/Testing/Temporary/LastTest.log; do
          if [ -f "$c" ]; then log="$c"; break; fi
        done
        if [ -z "$log" ]; then
          echo "::warning::$LABEL: LastTest.log not found under $BUILD_DIR/Testing"
          # 找不到就把实际布局列出来: Windows 两个作业连续两轮只留下 "not found",
          # 靠猜没有意义。仍然不用 find (Windows 的 bash 里它可能被解析成 find.exe)。
          for entry in "$BUILD_DIR" "$BUILD_DIR"/Testing "$BUILD_DIR"/Testing/*; do
            if [ -e "$entry" ]; then
              echo "::warning::$LABEL exists: $entry"
            else
              echo "::warning::$LABEL missing: $entry"
            fi
          done
          exit 0
        fi
        # 一个 ctest 目标里可能跑几百个用例, 只报目标名定位不到问题 ——
        # 断言消息本身: gtest 的 [  FAILED  ] 行只有用例名, 而定位真正需要的
        # 是紧跟 file:line: Failure 之后的期望/实际值 (测试把 errno 打在消息里时,
        # 不上报这一段就等于白打)。取 Failure 行及其后两行, 逐行截断避免超长。
        while IFS= read -r line; do
          detail=$(printf '%s' "$line" | tr -d '\r' | cut -c1-160)
          [ -n "$detail" ] && echo "::error::$LABEL gtest detail: $detail"
        done < <(grep -A6 -E '^[^:]+:[0-9]+: Failure' "$log" 2>/dev/null | head -n 60)

        # gtest 的失败行与 sanitizer 的诊断行才是可用粒度。
        gtest_failed=$(grep -oE '^\[  FAILED  \] [A-Za-z0-9_]+\.[A-Za-z0-9_]+' "$log" | sort -u | head -n 12)
        if [ -n "$gtest_failed" ]; then
          while IFS= read -r g; do
            echo "::error::$LABEL gtest failure: ${g#*] }"
          done <<< "$gtest_failed"
        fi
        # 只回传首行等于没有回传: 定位需要的是"哪次访问、哪个线程、栈顶在哪一行"。
        # 因此把 WRITE/READ of size ... by thread 与栈帧行 (#N 0x... in func file:line)
        # 一起报出, 栈帧只保留函数与源码位置、丢掉地址与偏移避免噪声。
        san_err=$(grep -oE '(ERROR: AddressSanitizer|ERROR: LeakSanitizer|WARNING: ThreadSanitizer|runtime error): [^[:cntrl:]]{0,120}' "$log" | sort -u | head -n 8)
        san_frames=$(grep -oE '(READ|WRITE) of size [0-9]+ at 0x[0-9a-f]+ by thread T[0-9]+' "$log" | sort -u | head -n 4)
        san_where=$(grep -oE '^ *#[0-9]+ 0x[0-9a-f]+ in [^(]{1,90}' "$log" | sed 's/^ *//' | head -n 12)
        if [ -n "$san_frames" ]; then
          while IFS= read -r f; do
            echo "::error::$LABEL sanitizer access: $f"
          done <<< "$san_frames"
        fi
        if [ -n "$san_where" ]; then
          while IFS= read -r w; do
            echo "::error::$LABEL sanitizer frame: $w"
          done <<< "$san_where"
        fi
        if [ -n "$san_err" ]; then
          while IFS= read -r e; do
            echo "::error::$LABEL sanitizer: $e"
          done <<< "$san_err"
        fi
        # 每测试节尾的结果行是 "Test Passed." / "Test Failed." (3.26 起即如此),
        # 个别版本还用 "***Failed <reason>" 行; 两种都认。
        failing=$(grep -nE 'Test Failed\.|^\*\*\*(Failed|Timeout|Not Run|SIGSEGV|SIGABRT|Exception)' "$log" | head -n 10)
        if [ -z "$failing" ]; then
          echo "::warning::$LABEL: ctest reported no failed case"
          exit 0
        fi
        while IFS= read -r line; do
          lineno=${line%%:*}
          # 结果行本身不含用例名, 回溯同一节内最近的 "N/M Testing: <name>" 行。
          name=$(awk -v n="$lineno" 'NR<=n { if (match($0, /Testing: .*/)) t = substr($0, RSTART + 9, RLENGTH - 9) } NR == n { print t }' "$log")
          echo "::error::$LABEL failed case: ${name:-unknown} ${line#*:}"
        done <<< "$failing"
        # 失败用例自身的输出片段最能说明原因, 一并留到摘要
        {
          echo "### $LABEL failing cases"
          echo '```'
          grep -B 2 -A 20 'Test Failed\.' "$log" | tail -n 120
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0
